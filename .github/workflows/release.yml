name: Release Docker and installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require a version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Run this workflow on a vMAJOR.MINOR.PATCH tag.'; exit 1;
          }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: go vet ./... && go test -count=1 ./...
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Verify installer syntax
        run: sh -n release/install.sh

  image:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test and export image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE:$VERSION"
          docker run -d --name mr-release-smoke -e DEMO_MODE=true -e SESSION_SECURE=false "$IMAGE@$DIGEST"
          healthy=false
          for attempt in $(seq 1 60); do
            if docker exec mr-release-smoke wget -q -O - http://127.0.0.1:8080/api/health; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then docker logs mr-release-smoke; exit 1; fi
          docker rm -f mr-release-smoke
          mkdir -p image-artifacts
          printf '%s\n' "$DIGEST" > "image-artifacts/digest-$ARCH.txt"
          docker save "$IMAGE:$VERSION" | gzip -1 > "image-artifacts/mr-system-$VERSION-linux-$ARCH-image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image-artifacts/*
          compression-level: 0
          retention-days: 3

  publish:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: image-artifacts
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest and installer
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          amd64=$(cat image-artifacts/digest-amd64.txt)
          arm64=$(cat image-artifacts/digest-arm64.txt)
          tags=(-t "$image:$VERSION")
          if [[ "$VERSION" != *-* ]]; then tags+=(-t "$image:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$image@$amd64" "$image@$arm64"
          digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '\"')
          python3 scripts/build-release.py --version "$VERSION" --image "$image@$digest" --commit "$COMMIT"
          cp image-artifacts/*.tar.gz dist-release/
          (cd dist-release && sha256sum *.tar.gz > SHA256SUMS)
          printf 'Docker image (amd64 / arm64): `%s@%s`\n\n下载安装包，按照其中 README.md 执行。SHA256SUMS 用于校验下载文件。安装包不包含任何生产数据、账号密码或上传文件。提供独立架构的 Docker 镜像归档，可用 docker load 导入。\n' "$image" "$digest" > /tmp/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            extra=()
            if [[ "$VERSION" == *-* ]]; then extra+=(--prerelease); fi
            gh release create "$VERSION" --verify-tag --title "MR System $VERSION" --notes-file /tmp/release-notes.md "${extra[@]}"
          fi
          gh release upload "$VERSION" dist-release/*.tar.gz dist-release/SHA256SUMS --clobber
